<!DOCtYPE html>
<html>

<head>
    <title>All Form Elements</title>
</head>
<link rel="stylesheet" href="style.css">

<body>

    <h1>Basic Form (element) of HTML</h1>

    <form>
        <fieldset>
            <legend>HTML page</legend>


            <label><b>Name:</b></label>
            <input type="text" placeholder="Enter your name">
            <br><br>

            <label><b>Password:</b></label>
            <input type="password" placeholder="Enter password">
            <br><br>

            <label><b>Email:</b></label>
            <input type="email" placeholder="Enter email">
            <br><br>

            <label><b>Age:</b></label>
            <input type="number" placeholder="Enter age">
            <br><br>

            <label><b>Phone:</b></label>
            <input type="tel" placeholder="Enter phone number">
            <br><br>

            <label><b>Website:</b></label>
            <input type="url" placeholder="Enter website URL">
        </fieldset>
        <br><br>
        <fieldset>

            <label for="message"><b>Message:</b></label>

            <textarea name="message" id="message" cols="70" rows="1">Drop a message...</textarea>

            <br><br>
            <label><b>Search:</b></label>
            <input type="search" placeholder="Search...">
            <br><br>

            <label><b>Date of Birth:</b></label>
            <input type="date">
            <br><br>

            <label><b>Time:</b></label>
            <input type="time">
            <br><br>

            <label><b>Date & Time:</b></label>
            <input type="datetime-local">
            <br><br>

            <label><b>Month:</b></label>
            <input type="month">
            <br><br>

            <label><b>Week:</b></label>
            <input type="week">
            <br><br>
            <hr>
            <label><b>Favorite Color:</b></label>
            <input type="color">
            <br><br>


            <label><b>Volume:</b></label>
            <input type="range" min="0" max="100">
            <br><br>


            <label><b>Upload File:</b></label>
            <input type="file">
            <br><br>

            <label><b>Gender:</b></label>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <br><br>

            <label><b>Hobbies:</b></label>

            <input type="checkbox"> Music
            <input type="checkbox"> Sports
            <br><br>


            <button type="submit" onclick="alert('Welcome to the html!')">Submit</button>
            <button type="reset" onclick="submitForm()">Reset</button>
        </fieldset>
    </form>
</body>
