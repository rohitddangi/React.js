<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>One Stop Digital Library for Creatives</title>
  <link rel="stylesheet" href="free.css" />
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="logo-img"></div>
      <p class="powered-by">Powered by MateBookLab<sup>®</sup></p>
    </div>
  </header>
  <main>
    <section class="hero">
      <h1>
        One Stop Digital<br>
        Library <span class="emoji">📚</span> for Creatives.
      </h1>
      <p class="subtitle">
        Digital library of books chosen by creatives for creatives.
      </p>
      <button class="cta-button">View Collections</button>
    </section>
    <div class="books-stack-clip">
      <div class="books-stack">
        <!-- Book images - replace with your own if desired -->
        <img src="https://i.imgur.com/3Dz1bWb.png" alt="Book 1" class="book book1">
        <img src="https://i.imgur.com/859gGzB.png" alt="Book 2" class="book book2">
        <img src="https://i.imgur.com/0y8Ftya.png" alt="Book 3" class="book book3">
        <img src="https://i.imgur.com/LnQX4bU.png" alt="Book 4" class="book book4">
        <img src="https://i.imgur.com/L8gJrG7.png" alt="Book 5" class="book book5">
      </div>
    </div>
  </main>
</body>
</html>
